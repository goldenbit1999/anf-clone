# ANF 클론 전체를 명령 하나로 띄운다 (FR-13, 설계 _workspace/containers/02_main_design.md, 스파이크 S9).
# 저장소 루트에서, sudo 없이 docker 그룹 사용자로:
#
#   docker compose -f deploy/compose.yaml up -d --build --wait
#
# 내리기는 docker compose -f deploy/compose.yaml down 이다. 볼륨 인스턴스(anf-nfs-<uuid>)는 agent가 compose 밖에서
# 띄우므로 남아서 데이터 서비스를 계속하고, 다시 up하면 agent가 이어받는다(결정 4). 리소스를 지우려면 API로 지운다.
# 모든 서비스가 host 네트워크의 127.0.0.1에만 바인딩한다(ADR §5, D-13). 대시보드는 http://127.0.0.1:8081/ 이다.
# 데이터 플레인 테스트(scripts/run-dataplane-tests.sh) 전에는 내린다(포트 8080·8081·8090·9090을 같이 쓴다).
name: anf-clone

services:
  # 한 번 돌고 끝나는 호스트 준비: setup-wsl-dataplane.sh를 호스트 네임스페이스에서 돌리고 ns를 rshared로 (deploy/init.sh)
  init:
    image: anf-clone-agent:latest
    pull_policy: never
    privileged: true
    pid: host
    network_mode: none
    volumes:
      - ..:/repo:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["bash", "/repo/deploy/init.sh"]

  # S9 Q2의 조건이 모두 있어야 한다(backend/tests/unit/test_compose.py가 지킨다):
  # 특권·host 네트워크·host pid(P4), /var/lib/anf-clone 비재귀 바인드(P3), ns rshared 바인드(P1, init이 먼저 준비),
  # /run/lock/lvm 공유(P2), /dev·/lib/modules·docker 소켓. 두 긴 문법 바인드는 create_host_path다: compose는 init을
  # 돌리기 전에 컨테이너를 모두 만들어서, /var/lib/anf-clone이 아직 없는 기기에서는 원본이 없다고 만들기가 거절된다.
  # LVM은 호스트 프로세스처럼 호스트 udev를 기다린다(L4): /run/udev(ro)와 host IPC를 함께 둔다. /run/udev만 있으면
  # lvcreate가 컨테이너 IPC의 udev 세마포어를 기다리며 멈추고(L3), 둘 다 없으면 lvcreate 직후 /dev/anf/<lv>가 없을 때가 있다
  storage-agent:
    image: anf-clone-agent:latest
    build:
      context: ..
      dockerfile: deploy/agent/Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
    privileged: true
    network_mode: host
    pid: host
    ipc: host
    volumes:
      - type: bind
        source: /var/lib/anf-clone
        target: /var/lib/anf-clone
        bind:
          recursive: disabled
          create_host_path: true
      - type: bind
        source: /var/lib/anf-clone/ns
        target: /var/lib/anf-clone/ns
        bind:
          propagation: rshared
          create_host_path: true
      - /run/lock/lvm:/run/lock/lvm
      - /run/udev:/run/udev:ro
      - /dev:/dev
      - /lib/modules:/lib/modules:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # HTTP는 시작 복구(볼륨 마운트, 인스턴스 기동)가 끝난 뒤에 열린다. 인스턴스가 NFSv4 유예 기간을 기다리면 2분 넘게 걸린다
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/storage/volumes', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 300s
      start_interval: 1s

  anf-api:
    image: anf-clone-api:latest
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    network_mode: host
    volumes:
      - anf-api-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/metrics', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 1s

  prometheus:
    image: prom/prometheus:v3.15.1
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.listen-address=127.0.0.1:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 1s

  dashboard:
    image: anf-clone-dashboard:latest
    build:
      context: ..
      dockerfile: deploy/dashboard/Dockerfile
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 1s

volumes:
  anf-api-data:
  prometheus-data:
