# 대시보드 (FR-13). host 네트워크에서 127.0.0.1에만 연다 (D-13, NFR-07).
# 브라우저는 같은 출처로 부르고 nginx가 넘긴다. Vite dev·preview 서버의 프록시(frontend/vite.config.ts)와 같은 규칙이다.
server {
    listen 127.0.0.1:8081;
    root /usr/share/nginx/html;

    # SPA: 파일이 없으면 index.html (쿼리 ?subscription=<id>는 앱이 읽는다)
    location / {
        try_files $uri /index.html;
    }

    # ARM API: 경로와 쿼리를 그대로 anf-api로
    location /subscriptions {
        proxy_pass http://127.0.0.1:8080;
    }

    # 메트릭: /prometheus/api/v1/... 를 접두사를 뗀 /api/v1/... 로 Prometheus에
    location /prometheus/ {
        proxy_pass http://127.0.0.1:9090/;
    }
}
